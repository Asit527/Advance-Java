server:
  port: 8080

spring:
  application:
    name: 11-06-api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: order-service
            uri: lb://11-03-ORDER-SERVICE
            predicates:
              - Path=/orders,/orders/**

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/