# 1. Unique name for your client application (this is what will appear in the Eureka Dashboard)
spring.application.name=08-02-eureka-client

# 2. Port for your client app (choose a port different from your Eureka Server, e.g., 8081)
server.port=8087

# 3. Eureka Client Configuration
# Point this to the URL where your Eureka Server is running (make sure the port matches your server's port)
eureka.client.service-url.defaultZone=http://localhost:8086/eureka/

# Ensure the client registers itself with Eureka
eureka.client.register-with-eureka=true

# Ensure the client fetches the registry so it can discover other services
eureka.client.fetch-registry=true

# Optional: Register using IP address instead of computer hostname (useful for local testing)
eureka.instance.prefer-ip-address=true